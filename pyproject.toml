[project]
name = "python_harness"
version = "1.0.0"
description = "Agent-independent feature harness (Jira drift + evidence-based acceptance) for Python + Microsoft Agent Framework projects."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.13",
    "keyring>=25",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    "behave>=1.2.6",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["scaffold/**/*", "scaffold/**/.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
