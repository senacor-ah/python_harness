# Release pipeline. Tag-driven: `git tag v1.0.0 && git push origin v1.0.0`.
# Builds sdist + wheel, PROVES the wheel is usable (scaffold present, `harness init`
# works in a clean repo), then publishes both as GitHub Release assets.
#
# Consumers install via git-tag dependency or by downloading the wheel asset — see
# docs/ADOPTION.md. GitHub Packages has no PyPI registry; if you later adopt a real
# index (Azure Artifacts), add a twine upload step at the end.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version lives in pyproject.toml, the tag lives in git. If they drift you
      # ship metadata that lies about itself, so fail loudly instead.
      - name: Tag must match project.version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != pyproject version $ver — bump pyproject.toml"; exit 1; }

      - name: Build sdist + wheel
        run: |
          pip install --quiet build
          python -m build

      # A wheel that installs but cannot scaffold is worthless to every consumer
      # repo. Verify the templates actually shipped, then run the real thing.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          scaffold = [n for n in names if n.startswith("harness/scaffold/")]
          assert len(scaffold) >= 15, f"scaffold templates missing from wheel: {scaffold}"
          assert not any(n.startswith("app/") for n in names), "demo app leaked into the wheel"
          print(f"wheel ok: {len(scaffold)} scaffold files, no app/")
          PY
          rm -rf /tmp/consumer && mkdir -p /tmp/consumer && cd /tmp/consumer && git init -q
          python -m venv .venv
          .venv/bin/pip install --quiet "$GITHUB_WORKSPACE/$wheel"
          .venv/bin/harness init
          .venv/bin/harness status
          test -f .harness/config.yaml && test -f .claude/hooks/scope_guard.py
          echo "harness init verified in a clean repo"

      - name: Publish GitHub Release with wheel + sdist
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
