# Architecture contracts enforced by import-linter as the Quality "architecture"
# gate (`lint-imports`). Written by `harness init`. >>> TAILOR to YOUR packages.
# Higher layers may import lower ones, never the reverse.
#
# If your code is one top-level package, use `root_package = <pkg>` and layer its
# subpackages (routes/workflows/agents/tools/services/models). If your layers are
# separate top-level packages, use `root_packages = ...` and `forbidden` contracts.

[importlinter]
root_packages =
    routes
    workflows
    agents
    tools
    services
    models

[importlinter:contract:layering]
name = Layered architecture (routes > workflows > agents > tools > services > models)
type = layers
layers =
    routes
    workflows
    agents
    tools
    services
    models

[importlinter:contract:tools-are-leaf-ish]
name = Tools must not import agents, workflows or routes
type = forbidden
source_modules =
    tools
forbidden_modules =
    agents
    workflows
    routes

[importlinter:contract:auth-isolated]
name = Auth must not depend on agents/workflows/routes
type = forbidden
source_modules =
    auth
forbidden_modules =
    agents
    workflows
    routes
